name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Prepare icons
        run: mkdir -p assets && cp -f icon-only.png icon-foreground.png icon-background.png assets/ || true
      - name: Generate app icons
        run: npx -y @capacitor/assets generate --android --iconBackgroundColor '#000000'
      - run: npx cap sync android
      - name: Force landscape
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mario-with-aria-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
