<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>بازی پلتفرمر</title>
<style>
:root{--bg:#f3f1ea;--fg:#222;--btn:#ffffffcc;--bd:#00000030;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--fg:#eee;--btn:#ffffff22;--bd:#ffffff30}}
:root[data-theme="dark"]{--bg:#17181c;--fg:#eee;--btn:#ffffff22;--bd:#ffffff30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
#hud{width:100%;max-width:640px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:10px 16px;font-weight:700;font-size:15px}#inf{padding:5px 12px;border-radius:99px;border:2px solid var(--bd);background:var(--btn);font-size:13px;touch-action:none}#inf.on{background:#ffb300cc;color:#222}
#wrap{position:relative;width:100%;max-width:640px}
canvas{width:100%;display:block;aspect-ratio:320/192;image-rendering:auto;background:#6ec6ff;border-radius:14px;box-shadow:0 6px 20px #0004}#msg{border-radius:14px}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;color:#fff;text-align:center;font-size:22px;font-weight:700;gap:8px;padding:16px}
#msg small{font-weight:400;font-size:15px;opacity:.85}
#pad{width:100%;max-width:640px;display:flex;justify-content:space-between;padding:12px 16px 20px;direction:ltr}
.g{display:flex;gap:14px}
.b{width:82px;height:82px;border-radius:50%;background:var(--btn);border:2px solid var(--bd);color:var(--fg);font-size:34px;display:flex;align-items:center;justify-content:center;touch-action:none}
.b.on{transform:scale(.93);background:#ffb300aa}
body{display:block}
#stage{--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);position:fixed;inset:0;overflow:hidden;background:#111}
@media (orientation:portrait){#stage{inset:auto;top:0;left:100%;width:100dvh;height:100dvw;transform-origin:0 0;transform:rotate(90deg);--st:env(safe-area-inset-right,0px);--sr:env(safe-area-inset-bottom,0px);--sb:env(safe-area-inset-left,0px);--sl:env(safe-area-inset-top,0px)}}
#wrap{position:absolute;inset:0;width:auto;max-width:none}
canvas{width:100%;height:100%;object-fit:contain;aspect-ratio:auto;border-radius:0;box-shadow:none;background:none}
#msg{border-radius:0}
#hud{position:absolute;z-index:3;top:calc(var(--st) + 6px);left:calc(var(--sl) + 12px);right:calc(var(--sr) + 12px);width:auto;max-width:none;padding:0;justify-content:flex-start;gap:8px;font-size:calc(13px*var(--hs,1));color:#fff;text-shadow:0 1px 2px #000a;pointer-events:none}
#hud span{background:#0006;padding:3px 10px;border-radius:99px}
#hud #inf{pointer-events:auto;margin-inline-start:auto;border:0}
#pad{position:absolute;z-index:4;left:var(--sl);right:var(--sr);bottom:var(--sb);width:auto;max-width:none;padding:0 14px 12px;align-items:flex-end;pointer-events:none}
.b{width:calc(68px*var(--bs,1));height:calc(68px*var(--bs,1));font-size:calc(28px*var(--bs,1));pointer-events:auto;opacity:.8;color:#fff;background:#00000055;border:2px solid #fff6}
.b.on{opacity:1;background:#ffb300aa}
#menu{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(var(--st) + 8px) calc(var(--sr) + 16px) calc(var(--sb) + 8px) calc(var(--sl) + 16px);background:linear-gradient(#2b6fd6f2,#0b2a5bf2);color:#fff;text-align:center;overflow:auto;touch-action:pan-y}
#menu h1{margin:0;font-size:30px;text-shadow:0 3px 0 #0006}
.mb{min-width:220px;padding:12px 22px;border-radius:14px;border:0;font:700 18px system-ui,Tahoma,sans-serif;background:#ffc400;color:#3b2a00;box-shadow:0 4px 0 #b8860b}
.mb.s{background:#fff;color:#0b2a5b;box-shadow:0 4px 0 #9bb}
#menu .coins{font-weight:700;font-size:16px;background:#0005;padding:4px 14px;border-radius:99px}
#items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:620px}
.it{background:#ffffff1f;border:2px solid #fff4;border-radius:12px;padding:8px;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center}
.it b{font-size:14px}
.it button{margin-top:2px;padding:5px 12px;border:0;border-radius:99px;font:700 12px system-ui,Tahoma,sans-serif;background:#ffc400;color:#3b2a00}
.it button:disabled{opacity:.55}
.it.own{border-color:#43d96b}
.menuOn #hud,.menuOn #pad{display:none}
#hud #mn{pointer-events:auto}
.row{display:flex;gap:8px}.mb.sm{min-width:0;padding:10px 14px;font-size:15px}
.sl{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}.sl input{width:170px}
.prev #hud,.prev #pad{display:flex!important;z-index:7}
#inf{display:none!important}
.ttl{font-size:26px;font-weight:800;color:#ffd54f;text-shadow:0 3px 0 #0008}.msg2{font-size:16px;font-weight:600}.stars{font-size:32px;letter-spacing:6px}.stars i{opacity:.25;font-style:normal}
.stat{font-size:14px;font-weight:600;background:#0005;padding:4px 14px;border-radius:99px}.ach{background:linear-gradient(#ffd54f,#ff9800);color:#3b2a00;font-weight:800;font-size:14px;padding:6px 16px;border-radius:12px}
.achv{position:absolute;z-index:8;top:calc(var(--st) + 10px);left:50%;display:flex;flex-direction:column;align-items:center;padding:10px 22px;border-radius:14px;background:linear-gradient(#ffd54f,#ff9800);color:#3b2a00;font-weight:700;box-shadow:0 6px 20px #0006;animation:ai .5s ease-out,ao .5s ease-in 4s forwards}
@keyframes ai{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}@keyframes ao{from{transform:translate(-50%,0)}to{transform:translate(-50%,-160%);opacity:0}}
.mb.sel{background:#ffc400;color:#3b2a00}
</style>
</head>
<body>
<div id="stage">
<div id="hud"><span>🪙 سکه: <b id="c">0</b></span><span>💰 ذخیره‌شده: <b id="t">0</b></span><span>❤️ جان: <b id="l">3</b></span><span id="inf">♾️ جان بی‌نهایت</span></div>
<div id="wrap">
<canvas id="cv" width="1280" height="768"></canvas>
<div id="msg"><div>🍄 ماجراجویی کوچک</div><small>برای شروع لمس کن<br>سکه‌ها را جمع کن، روی دشمن‌ها بپر و به پرچم برس</small></div>
</div>
<div id="pad">
<div class="g"><div class="b" data-k="l">◀</div><div class="b" data-k="r">▶</div></div>
<div class="b" data-k="j">⬆</div>
</div></div>
<script>
const T=16,W=320,H=192,LW=110,R=12;
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const g=new Uint8Array(LW*R);
const solid=(a,b)=>a<0||a>=LW?1:(b<0||b>=R?0:g[b*LW+a]);
const set=(a,b)=>{if(a>=0&&a<LW&&b>=0&&b<R)g[b*LW+a]=1};
const gaps=[[18,20],[40,43],[62,65],[85,88]];
for(let i=0;i<LW;i++){if(gaps.some(q=>i>=q[0]&&i<=q[1]))continue;set(i,10);set(i,11)}
const plats=[[10,7,4],[24,7,3],[30,5,4],[47,7,5],[54,5,3],[68,7,4],[74,5,3],[92,7,4],[19,8,2],[63,8,2]];
plats.forEach(([a,b,n])=>{for(let i=0;i<n;i++)set(a+i,b)});
const coins0=[];
plats.forEach(([a,b,n])=>{for(let i=0;i<n;i++)coins0.push([a+i,b-1])});
[5,6,7,34,35,52,53,78,79,80,98,99].forEach(a=>coins0.push([a,9]));
const spawn=[14,28,36,50,58,70,80,96,102];
let p,en,coins,cam,score,lives,state='menu',won=false;
const keys={l:0,r:0,j:0};
let total=0,inf=false,pj=0,cpx=2*T,toast=0;const cps=[31,54,76];let inv=0;function safe(){return inv>0||cps.some(a=>a*T<=cpx&&Math.abs(p.x-a*T)<48)}
try{total=+localStorage.getItem('mg_total')||0;inf=false}catch(_){}
function sv(){try{localStorage.setItem('mg_total',total);localStorage.setItem('mg_inf',inf?'1':'0');localStorage.setItem('mg_own',JSON.stringify(own));localStorage.setItem('mg_skin',skinOn?'1':'0')}catch(_){}}
document.getElementById('inf').addEventListener('pointerdown',e=>{e.preventDefault();inf=!inf;sv();hud()});
function reset(full){
 if(full)cpx=2*T;
 p={x:cpx,y:8*T,w:12,h:14,vx:0,vy:0,on:false,f:1,jc:0};
 en=spawn.map(a=>({x:a*T,y:10*T-12,w:12,h:12,d:-1,a:1,t:0}));
 if(full){coins=coins0.map(([a,b])=>({x:a*T+8,y:b*T+8,got:0}));score=0;lives=own.life?5:3}
 cam=Math.max(0,Math.min(LW*T-W,p.x-W/2));hud();
}
function hud(){document.getElementById('c').textContent=score;document.getElementById('t').textContent=total;document.getElementById('l').textContent=inf?'♾️':lives;document.getElementById('inf').classList.toggle('on',inf)}
function show(t,s){const m=document.getElementById('msg');m.innerHTML='<div>'+t+'</div><small>'+s+'</small>';m.style.display='flex'}
function hide(){document.getElementById('msg').style.display='none'}
function die(){
 if(!inf)lives--;hud();
 if(lives<=0){state='over';loseScreen();return;show('💀 باختی','امتیاز: '+score+' — برای شروع دوباره لمس کن')}
 else{reset(false);inv=120}
}
function moveX(o,dx){
 o.x+=dx;
 const tx=dx>0?Math.floor((o.x+o.w)/T):Math.floor(o.x/T);
 for(let ty=Math.floor(o.y/T);ty<=Math.floor((o.y+o.h-1)/T);ty++){
  if(solid(tx,ty)){o.x=dx>0?tx*T-o.w:(tx+1)*T;return true}
 }
 return false;
}
function moveY(o,dy){
 o.y+=dy;
 const ty=dy>0?Math.floor((o.y+o.h)/T):Math.floor(o.y/T);
 for(let tx=Math.floor(o.x/T);tx<=Math.floor((o.x+o.w-1)/T);tx++){
  if(solid(tx,ty)){o.y=dy>0?ty*T-o.h:(ty+1)*T;return true}
 }
 return false;
}
function update(){
 if(state!=='play')return;
 const dir=(keys.r?1:0)-(keys.l?1:0);
 if(dir)p.f=dir;
 p.vx+=(dir*(own.speed?2.1:1.7)-p.vx)*0.25;
 const jd=keys.j&&!pj;pj=keys.j;
 if(keys.j&&p.on){p.vy=own.jump?-7.1:-6.3;p.on=false}
 else if(jd&&!p.on&&p.jc<(own.tj?2:1)){p.vy=-5.8;p.jc++;burst(p.x+6,p.y+14,'#ffffff',8)}
 if(!keys.j&&p.vy<-2.5)p.vy=-2.5;
 p.vy=Math.min(p.vy+0.32,7);
 moveX(p,p.vx);
 if(p.x<0)p.x=0;
 p.on=false;
 const py=p.y;
 if(moveY(p,p.vy)){if(p.vy>0){p.on=true;p.jc=0}p.vy=0}
 if(inv>0)inv--;
 if(p.y>H+30){die();return}
 cps.forEach(a=>{if(a*T>cpx&&p.x>a*T-4){cpx=a*T;toast=70;burst(a*T+7,10*T-30,'#43d96b',14)}});
 coins.forEach(c=>{if(!c.got&&Math.abs(c.x-(p.x+6))<9+(own.mag?20:0)&&Math.abs(c.y-(p.y+7))<10+(own.mag?20:0)){c.got=1;score++;total++;sv();hud();burst(c.x,c.y,'#ffd600',8)}});
 for(const e of en){
  if(!e.a){e.t++;continue}
  const nx=e.x+(e.d>0?e.w:0)+e.d;
  const wall=solid(Math.floor(nx/T),Math.floor((e.y+6)/T));
  const edge=!solid(Math.floor(nx/T),Math.floor((e.y+e.h+2)/T));
  if(wall||edge)e.d*=-1;else e.x+=e.d*ES;
  if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
   if(p.vy>0&&py+p.h<=e.y+6){e.a=0;p.vy=-4.5;p.jc=0;score+=2;hud();burst(e.x+6,e.y+6,'#d7a77a',10)}
   else if(!safe()){die();return}
  }
 }
 if(p.x+p.w>105*T){state='over';winScreen();return;show('🎉 برنده شدی!','امتیاز: '+score+' — برای بازی دوباره لمس کن')}
 cam=Math.max(0,Math.min(LW*T-W,p.x-W/2));
}
let pt=[];
function burst(px,py,col,n){for(let i=0;i<n;i++)pt.push({x:px,y:py,vx:(Math.random()-.5)*3,vy:-Math.random()*3,l:25,c:col})}
function pu(){for(const q of pt){q.x+=q.vx;q.y+=q.vy;q.vy+=.15;q.l--}pt=pt.filter(q=>q.l>0)}
function spr(m,pal,ox,oy,fl){for(let r=0;r<m.length;r++){const s=m[r];for(let c=0;c<s.length;c++){const ch=s[fl?s.length-1-c:c];if(ch!=='.'){x.fillStyle=pal[ch];x.fillRect(ox+c,oy+r,1,1)}}}}
const PP={R:'#e53935',B:'#1e63d6',S:'#ffcc99',N:'#5d3a1a',Y:'#ffd600'};
const PH=['...RRRRR....','..RRRRRRRR..','..NNSSSNS...','.NSNSSSNSSS.','.NSNNSSSNSSS','..NSSSSNNNN.','...SSSSSSS..','..RRBRRBRR..','.RRRBBBBRRR.','.SSBYBBYBSS.','..SBBBBBBS..'];
const PL=[['..BBB..BBB..','.NNN....NNN.','.NNNN..NNNN'],['...BBBBBB...','..NNNBBNNN..','..NNN..NNN..'],['.BBB....BBB.','NNN......NNN','NN........NN']];
const GP={D:'#a0522d',K:'#3e2112',W:'#fff',S:'#f5d6a8',F:'#3e2112'};
const GM=['....DDDD....','..DDDDDDDD..','.DDDDDDDDDD.','.DKKDDDDKKD.','DDWKDDDDKWDD','DDWWDDDDWWDD','DDDDDDDDDDDD','..SSSSSSSS..','..SSSSSSSS..'];
const GF=[['.FFFF..FFFF.','FFFFF..FFFFF'],['FFFF....FFFF','.FFF....FFF.']];
const lg=(a,b,c,d,st)=>{const g=x.createLinearGradient(a,b,c,d);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};
const rg=(cx,cy,r,st)=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,r);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};
function rr(a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h)}
function ell(a,b,rx,ry){x.beginPath();x.ellipse(a,b,rx,ry,0,0,7)}
function hill(f,base,am,k,c1,c2,jag){x.fillStyle=lg(0,base-am-8,0,H,[[0,c1],[1,c2]]);x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=4){const u=i+cam*f;x.lineTo(i,jag?base-Math.abs(Math.sin(u*k))*am-Math.sin(u*k*3)*3:base+Math.sin(u*k)*am+Math.sin(u*k*2.3+1)*am*.4)}x.lineTo(W,H);x.fill()}
const CL=[[0,0,10],[11,-5,13],[24,0,10],[12,3,11]];
function draw(){
 const tm=performance.now()/100,T4=tm/10;
 x.setTransform(4,0,0,4,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';
 x.fillStyle=lg(0,0,0,H,TH.sky);x.fillRect(0,0,W,H);
 x.fillStyle=rg(255,46,120,[[0,'#fffbe0'],[.15,'#fff1a8cc'],[.4,'#ffd27a55'],[1,'#ffd27a00']]);x.fillRect(0,0,W,H);
 x.globalCompositeOperation='lighter';
 for(let i=0;i<4;i++){const a=1.6+i*.35+Math.sin(T4+i)*.04;x.fillStyle='#fff2c014';x.beginPath();x.moveTo(255,46);x.lineTo(255+Math.cos(a)*300,46+Math.sin(a)*300);x.lineTo(255+Math.cos(a+.12)*300,46+Math.sin(a+.12)*300);x.fill()}
 x.globalCompositeOperation='source-over';
 hill(.06,118,46,.018,TH.h[0],TH.h[1],1);hill(.15,136,16,.04,TH.h[2],TH.h[3]);hill(.3,148,12,.06,TH.h[4],TH.h[5]);hill(.5,160,8,.09,TH.h[6],TH.h[7]);
 for(let i=0;i<7;i++){const cx=((i*140-cam*.25)%(W+160)+W+160)%(W+160)-50,cy=16+(i*29)%60;x.fillStyle=TH.c1;CL.forEach(([dx,dy,r])=>{x.beginPath();x.arc(cx+dx,cy+dy+2.5,r,0,7);x.fill()});x.fillStyle=TH.c2;CL.forEach(([dx,dy,r])=>{x.beginPath();x.arc(cx+dx,cy+dy,r,0,7);x.fill()})}
 x.save();x.translate(-cam,0);
 const a0=Math.floor(cam/T),a1=Math.min(LW-1,a0+W/T+1),gd=lg(0,160,0,192,TH.d),gg=lg(0,160,0,167,TH.gr);
 for(let a=a0;a<=a1;a++)for(let b=0;b<R;b++){
  if(!solid(a,b))continue;const X=a*T,Y=b*T;
  if(b>=10){
   x.fillStyle=gd;x.fillRect(X,Y,T+.5,T);
   x.fillStyle='#00000026';x.beginPath();x.arc(X+(a*7+b*3)%12+2,Y+(a*5+b)%8+6,1.6,0,7);x.fill();
   x.fillStyle='#ffffff18';x.beginPath();x.arc(X+(a*3+b*5)%11+3,Y+(a*2+b*3)%7+3,1.1,0,7);x.fill();
   if(b===10){x.fillStyle=gg;x.fillRect(X,Y,T+.5,6);x.fillStyle='#0000002a';x.fillRect(X,Y+6,T+.5,1.5);x.fillStyle=TH.bl;for(let i=0;i<5;i++){const bx=X+i*3.4+1,sw=Math.sin(tm*.4+a+i)*.9;x.beginPath();x.moveTo(bx,Y+.5);x.lineTo(bx+1.4+sw,Y-3.2);x.lineTo(bx+2.6,Y+.5);x.fill()}}
   if(!solid(a-1,b)){x.fillStyle='#0000002e';x.fillRect(X,Y,1.5,T)}
  }else{
   x.fillStyle=lg(0,Y,0,Y+T,TH.br);rr(X+.3,Y+.3,T-.6,T-.6,2);x.fill();x.strokeStyle='#7a3a0e';x.lineWidth=.7;x.stroke();
   x.fillStyle='#ffffff55';x.fillRect(X+2,Y+1.5,T-4,1);x.fillStyle='#00000022';x.fillRect(X+2,Y+T-3,T-4,1.2);
   x.strokeStyle='#7a3a0e66';x.beginPath();x.moveTo(X+2,Y+8);x.lineTo(X+T-2,Y+8);x.moveTo(X+8,Y+2);x.lineTo(X+8,Y+8);x.stroke();
  }
 }
 cps.forEach(a=>{const X=a*T+6,on=cpx>=a*T,s=on?2:.3;
  if(on){x.globalCompositeOperation='lighter';x.fillStyle=rg(X+8,130,26,[[0,'#43d96b66'],[1,'#43d96b00']]);x.fillRect(X-20,104,56,56);x.globalCompositeOperation='source-over'}
  x.fillStyle='#cfd8dc';x.fillRect(X,124,2,36);x.fillStyle='#ffc400';x.beginPath();x.arc(X+1,122,2.6,0,7);x.fill();
  x.fillStyle=on?lg(X,0,X+15,0,[[0,'#6bf08a'],[1,'#1fae48']]):'#8fa3ad';x.beginPath();x.moveTo(X+2,125);x.quadraticCurveTo(X+8,127+Math.sin(tm+a)*s,X+15,130);x.quadraticCurveTo(X+8,133+Math.sin(tm+a+1)*s,X+2,136);x.fill()});
 const cx=106*T+4;
 x.fillStyle=lg(0,6*T,0,10*T,[[0,'#e2e6ec'],[1,'#8e96a3']]);x.fillRect(cx,6*T,44,4*T);x.fillRect(cx-4,5*T,12,5*T);x.fillRect(cx+36,5*T,12,5*T);
 x.fillStyle='#f1f3f6';for(let i=0;i<4;i++)x.fillRect(cx+i*12+1,6*T-5,8,5);
 x.fillStyle='#e04646';[cx-5,cx+35].forEach(t=>{x.beginPath();x.moveTo(t,5*T);x.lineTo(t+7,5*T-15);x.lineTo(t+14,5*T);x.fill()});
 x.fillStyle='#3a2a1a';x.fillRect(cx+16,8*T,12,2*T);x.beginPath();x.arc(cx+22,8*T,6,Math.PI,0);x.fill();

const zw=s=>s.replace(/\u200c/g,'');
function tr(s){let z=zw(s);RULES.forEach(([a,b])=>{z=z.replace(a,b)});return z}
const orig=new WeakMap();
function fixNode(n){if(!orig.has(n))orig.set(n,n.nodeValue);const o=orig.get(n),z=zw(o),r=lang==='en'?tr(o):z.replace(/ماجراجویی کوچک/,'ماریو با آریا');n.nodeValue=r===z?o:r}
function walk(r){if(r.nodeType===3){fixNode(r);return}const w=document.createTreeWalker(r,4);let n;while(n=w.nextNode())fixNode(n)}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(walk))).observe(stage,{childList:true,subtree:true});
